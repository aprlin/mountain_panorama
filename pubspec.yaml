name: mountain_panorama
description: "PeakFinder-like mountain panorama viewer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^5.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
